name: Build Switch (.nro)

# Manual trigger only: Actions tab -> "Build Switch (.nro)" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub's maximum. The very first run builds the NXVK Vulkan driver (slow).
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout (with submodules, including NXVK)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Raika's repo lists externals/nxvk in .gitmodules but never committed it,
      # so the checkout above does not create it. Fetch NXVK ourselves, pinned
      # to the commit this recipe was written against.
      - name: Fetch NXVK (pinned)
        shell: bash
        run: |
          set -eux
          rm -rf externals/nxvk
          mkdir -p externals/nxvk
          git -C externals/nxvk init
          git -C externals/nxvk remote add origin https://github.com/PalindromicBreadLoaf/nxvk.git
          git -C externals/nxvk fetch --depth 1 origin c3abea1efde44027b7e3e20b48eb55beeecd5ab4
          git -C externals/nxvk checkout FETCH_HEAD
          test -f externals/nxvk/Makefile

      - name: Work out NXVK cache key
        id: nxvk
        shell: bash
        run: |
          set -eu
          sha="$(git -C externals/nxvk rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # The NXVK driver only needs rebuilding when the externals/nxvk commit changes.
      - name: Restore cached NXVK build
        id: nxvk_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            externals/nxvk/switch/build
            externals/nxvk/switch/rust/sysroot
          key: nxvk-${{ steps.nxvk.outputs.sha }}

      - name: Build NXVK (Vulkan driver for Switch)
        id: nxvk_build
        if: steps.nxvk_cache.outputs.cache-hit != 'true'
        working-directory: externals/nxvk
        shell: bash
        run: |
          # sudo: the Docker container creates root-owned folders that the
          # Makefile itself (running on the host) must also be able to write to.
          sudo make driver CONTAINER=docker 2>&1 | tee "$GITHUB_WORKSPACE/nxvk-build.log"
          sudo chown -R "$USER" switch/build switch/rust/sysroot || true

      # Save right after NXVK succeeds, even if the emulator build below fails,
      # so a retry does not repeat the slow driver build.
      - name: Save NXVK build to cache
        if: always() && steps.nxvk_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            externals/nxvk/switch/build
            externals/nxvk/switch/rust/sysroot
          key: nxvk-${{ steps.nxvk.outputs.sha }}

      # Raika's CMake copies this license file into the app, but the file was
      # never committed to its repository. Create a short placeholder if missing.
      - name: Add file missing from Raika's repo
        shell: bash
        run: |
          f=src/citra_switch/GoogleSansFlex-OFL.txt
          if [ ! -f "$f" ]; then
            printf '%s\n' \
              "Google Sans Flex is licensed under the SIL Open Font License 1.1." \
              "Full text: https://openfontlicense.org/" \
              "(Placeholder: this file was not included in the Raika Azahar source repository.)" \
              > "$f"
          fi

          # Baixa o stb_image.h caso ele esteja faltando no repositório do Raika (Correção do erro do gametdb.cpp)
          mkdir -p externals/stb
          if [ ! -f externals/stb/stb_image.h ]; then
            curl -sSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o externals/stb/stb_image.h
          fi

          # Debug-logging helper that the renderer includes but that was never
          # committed. Every call site is fire-and-forget logging, so a no-op
          # version is behaviour-neutral (it only disables that diagnostic log).
          g=src/common/gpu_frame_log.h
          if [ ! -f "$g" ]; then
            cat > "$g" <<'EOF'
          // Stand-in for a header missing from the Raika Azahar repository.
          // Diagnostic frame logging is disabled; all functions are no-ops.
          #pragma once

          #include "common/common_types.h"

          namespace Common::GpuFrameLog {

          inline u64 CurrentFrame() {
              return 0;
          }

          inline void RecordInterpreterFallback() {}

          template <typename... Args>
          inline void LogFrame(Args&&...) {}

          template <typename... Args>
          inline void LogStall(Args&&...) {}

          template <typename... Args>
          inline void LogPipelineEvent(Args&&...) {}

          template <typename... Args>
          inline void LogShaderEvent(Args&&...) {}

          } // namespace Common::GpuFrameLog
          EOF
          fi

          # renderer_vulkan.cpp includes a generated shader header for
          # vulkan_menu.frag, but that shader source does not exist in the repo
          # and nothing uses its symbol. Drop the unused include.
          r=src/video_core/renderer_vulkan/renderer_vulkan.cpp
          if [ ! -f src/video_core/host_shaders/vulkan_menu.frag ]; then
            sed -i '/host_shaders\/vulkan_menu_frag\.h/d' "$r"
          fi

          # Raika's JIT setup calls Dynarmic::SetJitCompileLogEnabled(), a debug-log
          # switch added to the author's local dynarmic fork but never pushed (the
          # pinned externals/dynarmic commit has no jit_log.h). Add a no-op version.
          j=externals/dynarmic/src/dynarmic/interface/jit_log.h
          if [ ! -f "$j" ]; then
            cat > "$j" <<'EOF'
          // Stand-in for a header missing from the pinned dynarmic fork.
          // JIT-compile diagnostic logging is disabled; the function is a no-op.
          #pragma once

          namespace Dynarmic {

          inline void SetJitCompileLogEnabled(bool) {}

          } // namespace Dynarmic
          EOF
          fi

      - name: Build Raika Azahar (.nro)
        shell: bash
        run: |
          docker run --rm -v "$PWD:/work" -w /work devkitpro/devkita64 bash -lc '
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends cmake ninja-build git python3 pkg-config
            echo "== devkitPro packages already in the image =="
            dkp-pacman -Qq | grep -E "^(libnx|switch-)" || true
            missing=""
            for p in libnx switch-freetype switch-bzip2 switch-libpng switch-zlib; do
              dkp-pacman -Qq "$p" >/dev/null 2>&1 || missing="$missing $p"
            done
            echo "missing:$missing"
            if [ -n "$missing" ]; then
              ok=0
              for i in 1 2 3 4 5 6; do
                if dkp-pacman -Sy --noconfirm --needed $missing; then ok=1; break; fi
                echo "dkp-pacman attempt $i failed, retrying in 60s"
                sleep 60
              done
              [ "$ok" = 1 ] || { echo "Could not install devkitPro packages (pkg.devkitpro.org refused the download)"; exit 1; }
            fi
            cmake -S . -B build/switch \
              -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/Switch.cmake \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
              -DCMAKE_CXX_FLAGS="-I$PWD/externals/stb"
            cmake --build build/switch --target citra_switch_nro -j"$(nproc)"
          ' 2>&1 | tee build.log

      - name: Collect output
        if: success()
        run: |
          mkdir -p out
          cp build/switch/src/citra_switch/raikopon.nro out/
          ls -lh out

      - name: Upload .nro
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: raikopon-nro
          path: out/raikopon.nro

      # Logs are uploaded even when the build fails, so you can send them to me.
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            nxvk-build.log
          if-no-files-found: ignore
