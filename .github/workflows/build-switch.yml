name: Build Switch (.nro)

# Manual trigger only: Actions tab -> "Build Switch (.nro)" -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout (with submodules, including NXVK)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update dynarmic submodule (switch branch)
        shell: bash
        run: |
          set -eux
          git -C externals/dynarmic fetch origin switch
          git -C externals/dynarmic checkout FETCH_HEAD

      - name: Fetch NXVK (pinned)
        shell: bash
        run: |
          set -eux
          rm -rf externals/nxvk
          mkdir -p externals/nxvk
          git -C externals/nxvk init
          git -C externals/nxvk remote add origin https://github.com/PalindromicBreadLoaf/nxvk.git
          git -C externals/nxvk fetch --depth 1 origin c3abea1efde44027b7e3e20b48eb55beeecd5ab4
          git -C externals/nxvk checkout FETCH_HEAD
          test -f externals/nxvk/Makefile

      - name: Work out NXVK cache key
        id: nxvk
        shell: bash
        run: |
          set -eu
          sha="$(git -C externals/nxvk rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Restore cached NXVK build
        id: nxvk_cache
        uses: actions/cache/restore@v4
        with:
          path: |
            externals/nxvk/switch/build
            externals/nxvk/switch/rust/sysroot
          key: nxvk-${{ steps.nxvk.outputs.sha }}

      - name: Build NXVK (Vulkan driver for Switch)
        id: nxvk_build
        if: steps.nxvk_cache.outputs.cache-hit != 'true'
        working-directory: externals/nxvk
        shell: bash
        run: |
          sudo make driver CONTAINER=docker 2>&1 | tee "$GITHUB_WORKSPACE/nxvk-build.log"
          sudo chown -R "$USER" switch/build switch/rust/sysroot || true

      - name: Save NXVK build to cache
        if: always() && steps.nxvk_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            externals/nxvk/switch/build
            externals/nxvk/switch/rust/sysroot
          key: nxvk-${{ steps.nxvk.outputs.sha }}

      # Restaura o cache de compilacao C++ (ccache) para acelerar builds futuros
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-switch-${{ github.run_id }}
          restore-keys: |
            ccache-switch-

      - name: Add file missing from Raika's repo
        shell: bash
        run: |
          f=src/citra_switch/GoogleSansFlex-OFL.txt
          if [ ! -f "$f" ]; then
            printf '%s\n' \
              "Google Sans Flex is licensed under the SIL Open Font License 1.1." \
              "Full text: https://openfontlicense.org/" \
              "(Placeholder: this file was not included in the Raika Azahar source repository.)" \
              > "$f"
          fi

          # Baixa o stb_image.h e prepara o arquivo fonte para gerar a biblioteca libstb_image.a
          mkdir -p externals/stb
          if [ ! -f externals/stb/stb_image.h ]; then
            curl -sSL https://raw.githubusercontent.com/nothings/stb/master/stb_image.h -o externals/stb/stb_image.h
          fi
          cat > externals/stb/stb_image_impl.c <<'EOF'
          #define STB_IMAGE_IMPLEMENTATION
          #include "stb_image.h"
          EOF

          g=src/common/gpu_frame_log.h
          if [ ! -f "$g" ]; then
            cat > "$g" <<'EOF'
          #pragma once
          #include "common/common_types.h"
          namespace Common::GpuFrameLog {
          inline u64 CurrentFrame() { return 0; }
          inline void RecordInterpreterFallback() {}
          template <typename... Args> inline void LogFrame(Args&&...) {}
          template <typename... Args> inline void LogStall(Args&&...) {}
          template <typename... Args> inline void LogPipelineEvent(Args&&...) {}
          template <typename... Args> inline void LogShaderEvent(Args&&...) {}
          } // namespace Common::GpuFrameLog
          EOF
          fi

          j=externals/dynarmic/src/dynarmic/interface/jit_log.h
          if [ ! -f "$j" ]; then
            cat > "$j" <<'EOF'
          #pragma once
          namespace Dynarmic {
          inline void SetJitCompileLogEnabled(bool) {}
          } // namespace Dynarmic
          EOF
          fi

      - name: Integrate MM3D DekUI (Single Screen & Frame Interpolation)
        shell: bash
        run: |
          set -eux
          rm -rf /tmp/mm3d-dekui
